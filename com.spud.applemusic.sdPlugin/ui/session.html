<!DOCTYPE html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<title>Apple Music</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Session">
			<div class="sdpi-item-value">
				Controls Apple Music when that app has a Windows media session. Otherwise the key follows whatever Windows treats as the current session, and the artist line names that app.
			</div>
		</sdpi-item>
		<sdpi-item label="Artwork">
			<div class="sdpi-item-value">
				Now Playing draws the session's album art. A custom key image set in Stream Deck replaces it.
			</div>
		</sdpi-item>
	</body>
</html>
